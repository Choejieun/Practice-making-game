<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="한 인간의 생애를 관찰하는 다크 판타지 게임 프로토타입" />
    <title>무명신의 기록</title>
    <link rel="stylesheet" href="./styles.css?v=reset-4" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <main class="intro-screen" id="introScreen">
      <section class="intro-step intro-title-step" id="introTitleStep">
        <p class="intro-kicker">THE UNSEEN HAND</p>
        <h1>무명신의 기록</h1>
        <button class="intro-primary" id="introStartButton" type="button">게임 시작</button>
      </section>

      <section class="intro-step intro-story-step hidden" id="introStoryStep">
        <p class="intro-narration" id="introNarration" aria-live="polite"></p>
        <button class="intro-cradle hidden" id="introCradleButton" type="button" disabled aria-label="요람 속 아이">
          <img src="./assets/intro/cradle-scene.png" alt="어둠 속 요람에서 잠든 아이" />
          <span>아이에게 시선을 둔다</span>
        </button>

        <div class="intro-reveal hidden" id="introReveal">
          <p class="intro-question" id="introQuestion" aria-live="polite"></p>
          <div class="intro-traits" id="introTraits" aria-label="아이의 성격"></div>
          <div class="intro-actions hidden" id="introActions">
            <button class="gold-button" id="introBeginButton" type="button">이 운명을 지켜본다</button>
            <button class="text-button" id="introRerollButton" type="button">아이의 성격이 마음에 안 드는가?</button>
          </div>
        </div>
      </section>
    </main>

    <main class="first-screen hidden" id="firstScreen" aria-label="아이의 생애 첫 화면">
      <img class="first-emblem" src="./assets/icons/main-emblem.png" alt="무명신의 상징" />

      <aside class="hero-panel" id="heroPanel" aria-label="영웅 정보">
        <button class="hero-panel-handle" id="heroPanelHandle" type="button" aria-expanded="false" aria-controls="heroPanel">
          <img src="./assets/icons/health.png" alt="" />
          <span>영웅</span>
        </button>
        <div class="hero-panel-head">
          <img id="heroPanelPortrait" alt="아이의 초상" />
          <div>
            <small>관찰 중인 인간</small>
            <strong id="heroPanelName"></strong>
            <span>0세 · 유년기</span>
          </div>
        </div>
        <div class="hero-panel-section">
          <small>타고난 성격</small>
          <div class="hero-panel-traits" id="heroPanelTraits"></div>
        </div>
        <dl class="hero-panel-facts">
          <div><dt>부모</dt><dd id="heroParent"></dd></div>
          <div><dt>재산</dt><dd id="heroWealth"></dd></div>
        </dl>
      </aside>

      <section class="child-reveal" id="childReveal" aria-live="polite">
        <div class="child-portrait-wrap">
          <div class="child-portrait-halo" aria-hidden="true"></div>
          <img id="childPortrait" alt="관찰할 아이의 초상" />
        </div>
        <div class="child-copy">
          <p class="child-kicker">첫 번째 기록 · 유년기</p>
          <h2 id="childName">이름 없는 아이</h2>
          <div class="child-record" id="childRecord"></div>
          <div class="child-traits" id="childTraits"></div>
        </div>
      </section>

      <section class="card-stage" id="cardStage" aria-live="polite">
        <nav class="card-stage-tabs" aria-label="현재 운명의 흐름">
          <span class="active" id="progressTab">진행</span>
          <span id="trialTab">시련</span>
        </nav>
        <p class="card-stage-label" id="cardStageLabel"></p>
        <div class="card-table">
          <article class="fate-card progress-card" id="progressCard">
            <div class="card-face card-back">
              <img src="./assets/icons/divine-star.png" alt="" />
              <span>PROGRESS</span>
            </div>
            <div class="card-face card-front">
              <small>진행</small>
              <h3 id="progressTitle"></h3>
              <p id="progressText"></p>
              <footer id="progressEffect"></footer>
            </div>
          </article>

          <article class="fate-card trial-card" id="trialCard">
            <div class="card-face card-back trial-back">
              <img src="./assets/icons/trial.png" alt="" />
              <span>TRIAL</span>
            </div>
            <div class="card-face card-front">
              <small>시련</small>
              <h3 id="trialTitle"></h3>
              <p id="trialText"></p>
              <div class="trial-clock" id="trialClock"></div>
              <footer id="trialHint"></footer>
            </div>
          </article>
        </div>
      </section>

      <section class="divine-hand" id="divineHand" aria-label="신의 개입 카드">
        <p>시련에 개입하시겠습니까?</p>
        <div class="hand-cards" id="handCards"></div>
        <button class="watch-button" id="watchButton" type="button">개입하지 않고 지켜본다</button>
      </section>

      <section class="first-life-timeline" id="firstLifeTimeline" aria-label="유년기부터 노년기까지의 생애 진행도">
        <div class="first-progress-line"><i></i></div>
        <div class="first-life-stages">
          <div class="first-life-stage active"><span>유년기</span><i><img src="./assets/icons/divine-star.png" alt="현재 단계" /></i></div>
          <div class="first-life-stage"><span>청소년기</span><i></i></div>
          <div class="first-life-stage"><span>성인</span><i></i></div>
          <div class="first-life-stage"><span>중년</span><i></i></div>
          <div class="first-life-stage"><span>장년</span><i></i></div>
          <div class="first-life-stage"><span>노년</span><i></i></div>
        </div>
      </section>
    </main>

    <script src="./game.js?v=reset-4"></script>
  </body>
</html>
